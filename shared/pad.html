<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Touchpad</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="pad.css">
<style>
  html, body { height:100%; margin:0; }
  body { padding:0 16px 12px; overflow:hidden; }
  #host { height:100%; }
</style>
</head>
<body>
<div id="host"></div>
<script src="pad.js"></script>
<script>
  // Bluetooth transport: every call goes to the Android app, which sends real HID reports.
  var hid = window.AndroidHid;
  mountPad(document.getElementById('host'), {
    move: function (dx, dy) { hid.move(dx, dy); },
    button: function (b, a) { hid.button(b, a); },
    scroll: function (dx, dy) { hid.scroll(dx, dy); },
    text: function (s) { hid.text(s); },
    key: function (name, mods) { hid.key(name, (mods || []).join(',')); }
  }, { note: 'Bluetooth keyboard: US-layout keys only. For Sinhala, emoji and other scripts, use Wi-Fi.' });
</script>
</body>
</html>
