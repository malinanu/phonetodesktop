name: pages
# Publishes site/ (landing page + privacy policy) to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    # The repo's default branch is currently claude/phone-media-remote-ddrl6t; drop it once the default is renamed to main.
    branches: [main, claude/phone-media-remote-ddrl6t]
    paths: ["site/**", "shared/base.css", "shared/font.woff2", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the shared design system
        run: cp shared/base.css shared/font.woff2 site/
      - name: Fill in the Send files address (repo variable FILES_URL; the button stays hidden if unset)
        env:
          FILES_URL: ${{ vars.FILES_URL }}
        run: |
          # Only a plain https origin is accepted (letters, digits, dots, dashes, optional port).
          if [[ "$FILES_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?/?$ ]]; then
            sed -i "s|__FILES_URL__|${FILES_URL}|g" site/index.html
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
