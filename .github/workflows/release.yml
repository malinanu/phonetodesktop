name: release
# Builds installers + APK and puts them on the website's own server (the `server` job), in three ways:
#  - push to main that changes the programs (agent, android, installer, shared, brand, filesync/web which the agent embeds): a build "0.3.<run number>" goes to the
#    server automatically, so the download buttons always have files; no GitHub release is made for it;
#  - push a tag (git tag v1.0.0 && git push --tags): the same, plus a GitHub release, and the server images;
#  - Actions tab, Run workflow with a version such as 1.0.0: like a tag (the tag v1.0.0 is created on the chosen branch).
on:
  push:
    branches: [main]
    paths: ["agent/**", "android/**", "installer/**", "shared/**", "brand/**", "filesync/web/**", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 0.3.0)"
        required: true
permissions:
  contents: write
env:
  # The version being built: from the input when run by hand, the pushed tag, or for pushes to main 0.3.<run number>
  # (raise the 0.3 when a new minor version starts; real releases should use a higher version).
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || (github.ref_type == 'tag' && github.ref_name) || format('v0.3.{0}', github.run_number) }}
  # Only tags and manual runs make a GitHub release and publish the server images.
  IS_RELEASE: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
jobs:
  windows:
    runs-on: windows-latest
    env:
      WIN_CERT_B64: ${{ secrets.WIN_CERT_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        shell: bash
        run: |
          v="${TAG#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          # Only the package's own version (the first "version =" line); a plain sed rewrote the windows dependency's version too.
          awk -v v="$v" '!done && /^version = "/ { print "version = \"" v "\""; done = 1; next } { print }' agent/Cargo.toml > agent/Cargo.toml.new && mv agent/Cargo.toml.new agent/Cargo.toml
      - run: cargo test --manifest-path agent/Cargo.toml
      - run: cargo build --release --manifest-path agent/Cargo.toml
        env:
          PHONE_REMOTE_FILES_URL: ${{ vars.FILES_URL }}   # repo variable; empty hides "Send files" in the agent
      - name: Sign exe (optional)
        if: ${{ env.WIN_CERT_B64 != '' }}
        shell: pwsh
        env:
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WIN_CERT_B64))
          $st = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          & $st sign /f cert.pfx /p $env:WIN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 agent\target\release\phone-remote.exe
      - run: choco install innosetup -y --no-progress
      - run: iscc /DVersion=$env:VERSION installer\phone-remote.iss
      - name: Sign installer (optional)
        if: ${{ env.WIN_CERT_B64 != '' }}
        shell: pwsh
        env:
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          $st = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          Get-ChildItem dist\Lanyard-Setup-*.exe | ForEach-Object {
            & $st sign /f cert.pfx /p $env:WIN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            & $st verify /pa $_.FullName
          }
      - uses: actions/upload-artifact@v4
        with: { name: release-windows, path: dist/Lanyard-Setup-*.exe }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Keystore (optional)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          v="${TAG#v}"
          IFS=. read -r a b c <<< "$v"
          gradle -p android assembleRelease -PversionName="$v" -PversionCode=$((a*1000000 + b*1000 + ${c%%-*})) -PfilesUrl="${{ vars.FILES_URL }}"
      - run: mv android/app/build/outputs/apk/release/app-release.apk Lanyard-${TAG#v}.apk
      - uses: actions/upload-artifact@v4
        with: { name: release-android, path: Lanyard-*.apk }
      # Play Store bundle. Only built with a real keystore (Play rejects debug-signed bundles).
      # Kept as a workflow artifact, not attached to the public release; upload it in Play Console.
      - name: Build release AAB (Play Store)
        if: ${{ env.ANDROID_KEYSTORE_PATH != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          v="${TAG#v}"
          IFS=. read -r a b c <<< "$v"
          gradle -p android bundleRelease -PversionName="$v" -PversionCode=$((a*1000000 + b*1000 + ${c%%-*})) -PfilesUrl="${{ vars.FILES_URL }}"
          mv android/app/build/outputs/bundle/release/app-release.aab Lanyard-$v.aab
      - uses: actions/upload-artifact@v4
        if: ${{ env.ANDROID_KEYSTORE_PATH != '' }}
        with: { name: android-aab, path: Lanyard-*.aab }
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    # Built on 22.04 (glibc 2.35) so the binary and the .deb also run on Debian 12 and Ubuntu 22.04+.
    # The arm64 leg may be unavailable (private repos); it must not block the release.
    continue-on-error: ${{ matrix.arch == 'aarch64' }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        run: |
          v="${TAG#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          # Only the package's own version (the first "version =" line); a plain sed rewrote the windows dependency's version too.
          awk -v v="$v" '!done && /^version = "/ { print "version = \"" v "\""; done = 1; next } { print }' agent/Cargo.toml > agent/Cargo.toml.new && mv agent/Cargo.toml.new agent/Cargo.toml
      - run: cargo test --manifest-path agent/Cargo.toml
      - run: cargo build --release --manifest-path agent/Cargo.toml
        env:
          PHONE_REMOTE_FILES_URL: ${{ vars.FILES_URL }}
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-deb }
      - name: Package (.deb and tarball)
        run: |
          mkdir -p dist
          (cd agent && cargo deb --no-build)
          cp agent/target/debian/*.deb dist/
          installer/linux/make-tarball.sh "$VERSION" "${{ matrix.arch }}" agent/target/release/phone-remote dist
      - uses: actions/upload-artifact@v4
        with: { name: "release-linux-${{ matrix.arch }}", path: dist/* }
  macos:
    runs-on: macos-14
    env:
      MACOS_CERT_B64: ${{ secrets.MACOS_CERT_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        run: |
          v="${TAG#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          # Only the package's own version (the first "version =" line); a plain sed rewrote the windows dependency's version too.
          awk -v v="$v" '!done && /^version = "/ { print "version = \"" v "\""; done = 1; next } { print }' agent/Cargo.toml > agent/Cargo.toml.new && mv agent/Cargo.toml.new agent/Cargo.toml
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: cargo test --manifest-path agent/Cargo.toml
      - name: Build universal binary
        env:
          PHONE_REMOTE_FILES_URL: ${{ vars.FILES_URL }}
        run: |
          cargo build --release --manifest-path agent/Cargo.toml --target aarch64-apple-darwin
          cargo build --release --manifest-path agent/Cargo.toml --target x86_64-apple-darwin
          lipo -create -output phone-remote-universal \
            agent/target/aarch64-apple-darwin/release/phone-remote \
            agent/target/x86_64-apple-darwin/release/phone-remote
          lipo -info phone-remote-universal
      - name: Import Developer ID certificate (optional)
        if: ${{ env.MACOS_CERT_B64 != '' }}
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; PW=$(uuidgen)
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          echo "$MACOS_CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$PW" "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)".*/\1/')
          echo "MACOS_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
      - name: Build .app and .dmg (signed and notarized when the secrets exist)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: installer/macos/make-dmg.sh "$VERSION" phone-remote-universal dist
      - uses: actions/upload-artifact@v4
        with: { name: release-macos, path: dist/*.dmg }
  publish:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: [windows, android, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "release-*", path: out, merge-multiple: true }
      - name: latest.json and SHA256SUMS (the website reads latest.json)
        run: python3 installer/make_latest.py out "${TAG#v}" "${{ github.repository }}" --tag "$TAG"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: out/*
          generate_release_notes: true
  # Copies the finished files to the website's own server (downloads/<version>/ in the CloudPanel site folder) and
  # writes the latest.json the website reads, so the download buttons point at lanyard.3logiq.com itself. The GitHub
  # release above stays as a mirror. Uses the same secrets as deploy-site.yml; without them this job does nothing.
  server:
    needs: [windows, android, linux, macos]
    runs-on: ubuntu-latest
    # One upload at a time, so two quick pushes cannot write the same folders together.
    concurrency: { group: release-server, cancel-in-progress: false }
    env:
      SITE_SSH_HOST: ${{ secrets.SITE_SSH_HOST }}
      SITE_SSH_USER: ${{ secrets.SITE_SSH_USER }}
      SITE_SSH_PATH: ${{ secrets.SITE_SSH_PATH }}
      SITE_URL: https://lanyard.3logiq.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "release-*", path: out, merge-multiple: true }
      - name: Version
        run: |
          v="${TAG#v}"
          # The version becomes part of a folder name on the server: only plain version numbers are accepted.
          printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$' || { echo "::error::Not a version: $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: latest.json and SHA256SUMS (the links point at the website's own copy)
        run: |
          # Builds from main have no GitHub release, so their files have no GitHub mirror to point at.
          extra=""; [ "$IS_RELEASE" = "true" ] || extra="--no-github"
          python3 installer/make_latest.py out "$VERSION" "${{ github.repository }}" --tag "$TAG" --base-url "$SITE_URL/downloads/$VERSION" --page-url "$SITE_URL/downloads.html" $extra
      - name: Upload to the server over SSH
        env:
          SITE_SSH_KEY: ${{ secrets.SITE_SSH_KEY }}
          SITE_SSH_KNOWN_HOSTS: ${{ secrets.SITE_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SITE_SSH_HOST" ] || [ -z "$SITE_SSH_USER" ] || [ -z "$SITE_SSH_KEY" ] || [ -z "$SITE_SSH_PATH" ] || [ -z "$SITE_SSH_KNOWN_HOSTS" ]; then
            echo "Server secrets are not all set: the files are only on the GitHub release."; exit 0
          fi
          if ! printf '%s' "$SITE_SSH_PATH" | grep -Eq '^/home/[a-z0-9_-]+/htdocs/[A-Za-z0-9.-]+/?$'; then
            echo "::error::SITE_SSH_PATH must look like /home/<site user>/htdocs/<domain>"; exit 1
          fi
          dest="${SITE_SSH_PATH%/}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SITE_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SITE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh_cmd="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          # The files first (never deleting anything), then latest.json, so the page never points at files that are not there yet.
          rsync -rltz -O --mkpath -e "$ssh_cmd" out/ "$SITE_SSH_USER@$SITE_SSH_HOST:$dest/downloads/$VERSION/"
          rsync -rltz -O -e "$ssh_cmd" out/latest.json "$SITE_SSH_USER@$SITE_SSH_HOST:$dest/latest.json"
          # Keep the newest 5 version folders (names are checked, so nothing else can be removed).
          $ssh_cmd "$SITE_SSH_USER@$SITE_SSH_HOST" "cd '$dest/downloads' && ls -1 | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?\$' | sort -V | head -n -5 | xargs -r -I{} rm -rf -- {}"
          rm -f ~/.ssh/deploy_key
          echo "Uploaded $VERSION to $SITE_SSH_HOST"
      - name: Check the live files answer
        continue-on-error: true
        run: |
          if [ -z "$SITE_SSH_HOST" ]; then exit 0; fi
          curl -fsSIL --retry 5 --retry-delay 5 "$SITE_URL/downloads/$VERSION/SHA256SUMS" | head -1
          curl -fsS "$SITE_URL/latest.json" | python3 -c "import json,sys; d=json.load(sys.stdin); print('latest.json on the site:', d['version'], len(d['assets']), 'files')"
  # FileSync server image for the VPS (see docs/DEPLOYING-SERVER.md). Pushed to GHCR with the
  # built-in token, so no extra secrets are needed. Image names must be lowercase.
  files-image:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3   # needed to build the arm64 image on an amd64 runner
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tag
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: filesync
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/malinanu/phonetodesktop-files:latest
            ghcr.io/malinanu/phonetodesktop-files:${{ steps.tag.outputs.version }}
  # Account service image (optional; see docs/ACCOUNTS.md).
  account-image:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3   # arm64 too, for Oracle Ampere servers
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tag
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: account
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/malinanu/phonetodesktop-account:latest
            ghcr.io/malinanu/phonetodesktop-account:${{ steps.tag.outputs.version }}

