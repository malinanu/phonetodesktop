name: release
# Tag a version (git tag v1.0.0 && git push --tags) to publish installer + APK on GitHub Releases.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      WIN_CERT_B64: ${{ secrets.WIN_CERT_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          sed -i "s/^version = \".*\"/version = \"$v\"/" agent/Cargo.toml
      - run: cargo test --manifest-path agent/Cargo.toml
      - run: cargo build --release --manifest-path agent/Cargo.toml
      - name: Sign exe (optional)
        if: ${{ env.WIN_CERT_B64 != '' }}
        shell: pwsh
        env:
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WIN_CERT_B64))
          $st = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          & $st sign /f cert.pfx /p $env:WIN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 agent\target\release\phone-remote.exe
      - run: choco install innosetup -y --no-progress
      - run: iscc /DVersion=$env:VERSION installer\phone-remote.iss
      - name: Sign installer (optional)
        if: ${{ env.WIN_CERT_B64 != '' }}
        shell: pwsh
        env:
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          $st = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          Get-ChildItem dist\PhoneRemote-Setup-*.exe | ForEach-Object {
            & $st sign /f cert.pfx /p $env:WIN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            & $st verify /pa $_.FullName
          }
      - uses: actions/upload-artifact@v4
        with: { name: windows-installer, path: dist/PhoneRemote-Setup-*.exe }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Keystore (optional)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          IFS=. read -r a b c <<< "$v"
          gradle -p android assembleRelease -PversionName="$v" -PversionCode=$((a*10000 + b*100 + ${c%%-*}))
      - run: mv android/app/build/outputs/apk/release/app-release.apk PhoneRemote-${GITHUB_REF_NAME#v}.apk
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: PhoneRemote-*.apk }
      # Play Store bundle. Only built with a real keystore (Play rejects debug-signed bundles).
      # Kept as a workflow artifact, not attached to the public release; upload it in Play Console.
      - name: Build release AAB (Play Store)
        if: ${{ env.ANDROID_KEYSTORE_PATH != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          IFS=. read -r a b c <<< "$v"
          gradle -p android bundleRelease -PversionName="$v" -PversionCode=$((a*10000 + b*100 + ${c%%-*}))
          mv android/app/build/outputs/bundle/release/app-release.aab PhoneRemote-$v.aab
      - uses: actions/upload-artifact@v4
        if: ${{ env.ANDROID_KEYSTORE_PATH != '' }}
        with: { name: android-aab, path: PhoneRemote-*.aab }
  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: windows-installer, path: out }
      - uses: actions/download-artifact@v4
        with: { name: android-apk, path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
