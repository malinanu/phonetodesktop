name: account-checks

on:
  push:
    paths: ["account/**", ".github/workflows/account-checks.yml"]
  pull_request:
    paths: ["account/**", ".github/workflows/account-checks.yml"]

defaults:
  run:
    working-directory: account

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: account/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check app tests
      - run: python -m pytest -q
      - name: The Docker image builds and answers /health
        working-directory: .
        run: |
          docker build -t phoneremote-account:ci account
          docker run -d --name acct -e ACCOUNT_DEV_MODE=1 -e DATABASE_URL=sqlite:////tmp/a.db -p 18900:8000 phoneremote-account:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18900/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:18900/.well-known/phoneremote.json
          docker rm -f acct
