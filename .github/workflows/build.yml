name: build
on: [push, pull_request]
jobs:
  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path agent/Cargo.toml
      - run: cargo build --release --manifest-path agent/Cargo.toml
      - uses: actions/upload-artifact@v4
        with: { name: phone-remote-windows, path: agent/target/release/phone-remote.exe }
  android-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: phone-remote-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
