[package]
name = "phone-remote-agent"
version = "0.2.0"
edition = "2021"
description = "Desktop agent that lets a phone control media playback over the local network"
license = "MIT"

[[bin]]
name = "phone-remote"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
dirs = "6"
if-addrs = "0.13"
mdns-sd = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
enigo = { version = "0.5", default-features = false, features = ["x11rb"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Foundation",
  "Media_Control",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Kernel",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

# Debian/Ubuntu package: `cargo deb` (see .github/workflows/release.yml)
[package.metadata.deb]
name = "phone-remote"
maintainer = "malinanu <malinanu@users.noreply.github.com>"
copyright = "2026 malinanu"
license-file = ["../LICENSE", "0"]
section = "sound"
priority = "optional"
depends = "$auto"
# Volume control uses wpctl (PipeWire) or pactl (PulseAudio).
recommends = "pipewire-bin | pulseaudio-utils"
extended-description = "Phone Remote lets your phone control this computer's media (play, pause, skip, seek, volume), touchpad and keyboard over your local network. Open it from the applications menu, scan the QR code with the phone app, and approve the phone."
assets = [
  ["target/release/phone-remote", "usr/bin/", "755"],
  ["../installer/linux/phone-remote.desktop", "usr/share/applications/", "644"],
  ["../installer/assets/phone-remote.png", "usr/share/icons/hicolor/512x512/apps/phone-remote.png", "644"],
  ["../README.md", "usr/share/doc/phone-remote/README.md", "644"],
]
