<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e0f13">
<title>Phone Remote</title>
<style>
  :root { --bg:#0e0f13; --card:#181a21; --card2:#20232c; --fg:#eef0f6; --dim:#8b90a0; --acc:#5b8cff; --ok:#3ecf8e; --bad:#ff6b6b; --r:22px; }
  @media (prefers-color-scheme: light) { :root { --bg:#f3f4f8; --card:#fff; --card2:#eceef5; --fg:#14161c; --dim:#666b7a; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px system-ui,sans-serif; display:flex; flex-direction:column;
         padding:max(12px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom)); max-width:520px; margin:0 auto; user-select:none; }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:44px; }
  .pill { display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border-radius:99px; background:var(--card); font-size:13px; color:var(--dim); max-width:60%; }
  .pill span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #dot { width:8px; height:8px; border-radius:50%; background:var(--bad); flex:none; }
  #dot.on { background:var(--ok); }
  .hdr-r { display:flex; gap:8px; align-items:center; }
  select { background:var(--card); color:var(--fg); border:0; border-radius:99px; padding:8px 12px; font-size:13px; max-width:140px; }
  .icon-btn { width:40px; height:40px; border-radius:50%; border:0; background:var(--card); color:var(--dim); display:grid; place-items:center; }
  svg { width:1em; height:1em; fill:currentColor; display:block; }

  .now { flex:1; display:flex; flex-direction:column; justify-content:center; min-height:0; padding:12px 0; }
  .art { width:min(46vw,190px); aspect-ratio:1; margin:0 auto 20px; border-radius:28px; background:linear-gradient(140deg,var(--acc),#8a5bff);
         display:grid; place-items:center; color:#fff; font-size:64px; box-shadow:0 12px 32px rgba(91,140,255,.28); }
  .art.idle { background:var(--card); color:var(--dim); box-shadow:none; }
  #title { font-size:22px; font-weight:700; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #artist { color:var(--dim); text-align:center; margin-top:4px; min-height:1.4em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px; }
  .seek { margin-top:22px; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:32px; background:transparent; margin:0; }
  input[type=range]::-webkit-slider-runnable-track { height:6px; border-radius:6px; background:linear-gradient(to right,var(--acc) var(--p,0%),var(--card2) var(--p,0%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; margin-top:-8px; border-radius:50%; background:#fff; box-shadow:0 1px 6px rgba(0,0,0,.4); }
  input[type=range]:disabled { opacity:.35; }
  .times { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; margin-top:-2px; }

  .controls { display:grid; grid-template-columns:1fr 1fr 1.5fr 1fr 1fr; gap:10px; align-items:center; margin-top:8px; }
  button.c { border:0; border-radius:var(--r); background:var(--card); color:var(--fg); aspect-ratio:1; display:grid; place-items:center; font-size:26px; cursor:pointer; position:relative; transition:transform .08s, background .15s; }
  button.c:active { transform:scale(.92); background:var(--card2); }
  button.c .lbl { position:absolute; font-size:10px; font-weight:800; }
  button.c.main { background:var(--acc); color:#fff; font-size:38px; border-radius:50%; box-shadow:0 8px 24px rgba(91,140,255,.4); }
  button.c.main:active { background:#4677f0; }
  .sub { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:12px; }
  button.s { border:0; border-radius:16px; background:var(--card); color:var(--fg); height:52px; font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px; }
  button.s:active { background:var(--card2); transform:scale(.96); }
  button.s svg { font-size:20px; }
  body.off .controls, body.off .sub, body.off .seek { opacity:.4; pointer-events:none; }

  #toast { position:fixed; left:50%; bottom:max(24px,env(safe-area-inset-bottom)); transform:translate(-50%,20px); background:#2b2f3a; color:#fff; padding:12px 18px; border-radius:14px; font-size:14px; opacity:0; transition:.2s; pointer-events:none; max-width:88vw; text-align:center; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  #menu { position:fixed; inset:0; display:none; background:rgba(0,0,0,.5); align-items:flex-end; justify-content:center; }
  #menu.show { display:flex; }
  #menu .sheet { background:var(--card); width:100%; max-width:520px; border-radius:24px 24px 0 0; padding:20px 20px max(24px,env(safe-area-inset-bottom)); }
  #menu h3 { margin:0 0 4px; } #menu p { margin:0 0 16px; color:var(--dim); font-size:14px; }
  #menu button { width:100%; height:50px; border:0; border-radius:14px; font-size:16px; font-weight:600; margin-top:8px; background:var(--card2); color:var(--fg); }
  #menu button.danger { color:var(--bad); }
  #gate { position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px; gap:12px; }
  #gate.show { display:flex; } #gate h2 { margin:0; } #gate p { color:var(--dim); max-width:26em; margin:0; line-height:1.5; }
  #gate .art { font-size:44px; width:110px; margin-bottom:8px; }
</style>
</head>
<body class="off">
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></symbol>
    <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></symbol>
    <symbol id="i-volup" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></symbol>
    <symbol id="i-voldn" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.5 2.5c0-.2 0-.5 0-.7zM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5A9 9 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12zM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.2 4.2c-.7.5-1.4.9-2.2 1.1v2.1a9 9 0 0 0 3.6-1.8l2 2 1.3-1.3L12 8zM12 4 9.900 6.100 12 8.200z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></symbol>
  </defs>
</svg>

<header>
  <div class="pill"><span id="dot"></span><span id="stxt">Connecting…</span></div>
  <div class="hdr-r">
    <select id="players" aria-label="Player" style="display:none"></select>
    <button class="icon-btn" id="more" aria-label="Menu"><svg><use href="#i-more"/></svg></button>
  </div>
</header>

<section class="now">
  <div class="art idle" id="art">♪</div>
  <div id="title">Nothing playing</div>
  <div id="artist">Start a video or song on your PC</div>
  <div class="seek">
    <input id="bar" type="range" min="0" max="1" value="0" step="1" disabled aria-label="Seek">
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  </div>
</section>

<div class="controls">
  <button class="c" data-c="seek" data-d="-10" aria-label="Back 10 seconds"><svg><use href="#i-back"/></svg><span class="lbl">10</span></button>
  <button class="c" data-c="prev" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
  <button class="c main" id="pp" data-c="play_pause" aria-label="Play or pause"><svg><use href="#i-play"/></svg></button>
  <button class="c" data-c="next" aria-label="Next"><svg><use href="#i-next"/></svg></button>
  <button class="c" data-c="seek" data-d="10" aria-label="Forward 10 seconds"><svg><use href="#i-fwd"/></svg><span class="lbl">10</span></button>
</div>
<div class="sub">
  <button class="s" data-c="volume" data-d="-2" data-repeat aria-label="Volume down"><svg><use href="#i-voldn"/></svg></button>
  <button class="s" data-c="volume" data-d="2" data-repeat aria-label="Volume up"><svg><use href="#i-volup"/></svg></button>
  <button class="s" data-c="mute" aria-label="Mute"><svg><use href="#i-mute"/></svg></button>
  <button class="s" data-c="seek" data-d="30" aria-label="Forward 30 seconds">+30s</button>
</div>

<div id="toast"></div>
<div id="menu"><div class="sheet">
  <h3 id="mhost">This PC</h3><p>Connected over your local network.</p>
  <button id="reconnect">Reconnect</button>
  <button id="forget" class="danger">Forget this PC</button>
  <button id="close">Close</button>
</div></div>
<div id="gate">
  <div class="art">♪</div>
  <h2>Pair with your PC</h2>
  <p>On the PC, open the <b>Phone Remote</b> tray icon and choose <b>Pair a phone</b>, then scan the QR code with this phone's camera.</p>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = 'pr.token';
  let token = null;
  try {
    const m = /[#&]k=([^&]+)/.exec(location.hash);
    if (m) { localStorage.setItem(KEY, m[1]); history.replaceState(null, '', location.pathname); }
    token = localStorage.getItem(KEY);
  } catch (e) {}
  if (!token) { $('gate').classList.add('show'); return; }

  let rejected = false, ws, state = null, recvAt = 0, retry = 500, seeking = false, hb, toastT;
  const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600);
    const m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2,'0')}:${x}` : `${m}:${x}`; };
  const cur = () => state && state.players.find(p => p.id === state.current);
  const buzz = n => navigator.vibrate && navigator.vibrate(n);
  const toast = t => { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600); };
  const setStatus = (on, t) => { $('dot').classList.toggle('on', on); $('stxt').textContent = t; document.body.classList.toggle('off', !on); };
  const setIcon = (btn, id) => btn.querySelector('use').setAttribute('href', '#' + id);

  function connect() {
    setStatus(false, 'Connecting…');
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => ws.send(JSON.stringify({ t: 'auth', token }));
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.t === 'auth') {
        if (m.ok) { retry = 500; clearInterval(hb); hb = setInterval(() => send({ t: 'ping' }), 15000); }
        else {
          // Only a wrong secret unpairs; a lockout is temporary and must not wipe a valid pairing.
          rejected = true;
          if (m.err === 'bad token') { $('gate').classList.add('show'); localStorage.removeItem(KEY); }
          else setStatus(false, 'Locked out — retry in a minute');
          ws.close();
        }
      } else if (m.t === 'state') { state = m; recvAt = performance.now(); setStatus(true, m.host); render(true); }
      else if (m.t === 'ack' && !m.ok) { buzz(80); toast(m.err || 'That did not work'); }
    };
    ws.onclose = () => {
      clearInterval(hb);
      if (rejected) { rejected = false; if ($('gate').classList.contains('show')) return; retry = 60000; }
      else setStatus(false, 'Reconnecting…');
      setTimeout(connect, retry); retry = Math.min(retry * 1.6, 5000);
    };
    ws.onerror = () => ws.close();
  }
  const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));

  function render(full) {
    const p = cur();
    if (full) {
      const sel = $('players');
      const ids = state.players.map(pl => pl.id).join('|');
      if (sel.dataset.ids !== ids) {   // rebuilding every push would close the open dropdown
        sel.dataset.ids = ids;
        sel.innerHTML = '';
        state.players.forEach(pl => { const o = document.createElement('option'); o.value = pl.id; o.textContent = pl.app; sel.appendChild(o); });
      }
      if (document.activeElement !== sel && state.current) sel.value = state.current;
      sel.style.display = state.players.length > 1 ? '' : 'none';
      $('title').textContent = p ? (p.title || p.app) : 'Nothing playing';
      $('artist').textContent = p ? (p.artist || p.app) : 'Start a video or song on your PC';
      $('art').className = 'art' + (p ? '' : ' idle');
      $('art').textContent = p ? '♪' : '♪';
      setIcon($('pp'), p && p.playing ? 'i-pause' : 'i-play');
      $('bar').disabled = !p || !p.can_seek;
      $('bar').max = p ? Math.max(1, p.dur_ms) : 1;
      $('dur').textContent = p && p.dur_ms > 0 ? fmt(p.dur_ms) : '';
      $('mhost').textContent = state.host;
    }
    if (p && !seeking) {
      const pos = Math.min(p.dur_ms, p.pos_ms + (p.playing ? performance.now() - recvAt : 0));
      $('bar').value = pos; $('cur').textContent = fmt(pos);
      $('bar').style.setProperty('--p', p.dur_ms > 0 ? (100 * pos / p.dur_ms) + '%' : '0%');
    } else if (!p) { $('bar').value = 0; $('cur').textContent = '0:00'; $('bar').style.setProperty('--p', '0%'); }
  }
  setInterval(() => state && render(false), 250);

  // Buttons; volume repeats while held.
  let rep;
  const fire = b => {
    buzz(15);
    const c = b.dataset.c, d = +b.dataset.d;
    if (c === 'seek') send({ t: 'cmd', c: 'seek_rel', d });
    else if (c === 'volume') send({ t: 'cmd', c: 'volume', d });
    else send({ t: 'cmd', c });
  };
  document.addEventListener('pointerdown', e => {
    const b = e.target.closest('button[data-c]'); if (!b) return;
    fire(b);
    if (b.hasAttribute('data-repeat')) { clearInterval(rep); rep = setTimeout(() => { rep = setInterval(() => fire(b), 140); }, 350); }
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => document.addEventListener(ev, () => { clearTimeout(rep); clearInterval(rep); }));

  $('players').onchange = e => send({ t: 'cmd', c: 'select', id: e.target.value });
  const bar = $('bar');
  bar.oninput = () => { seeking = true; $('cur').textContent = fmt(+bar.value); bar.style.setProperty('--p', (100 * bar.value / bar.max) + '%'); };
  bar.onchange = () => { send({ t: 'cmd', c: 'seek_abs', pos_ms: +bar.value }); setTimeout(() => seeking = false, 700); };

  $('more').onclick = () => $('menu').classList.add('show');
  $('close').onclick = () => $('menu').classList.remove('show');
  $('menu').onclick = e => { if (e.target.id === 'menu') $('menu').classList.remove('show'); };
  $('reconnect').onclick = () => { $('menu').classList.remove('show'); if (ws) ws.close(); };
  $('forget').onclick = () => { localStorage.removeItem(KEY); location.reload(); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden && ws && ws.readyState > 1) connect(); });
  connect();
})();
</script>
</body>
</html>
